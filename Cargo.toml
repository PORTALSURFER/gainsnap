[package]
name = "gainsnap"
version = "0.1.0"
edition = "2021"
publish = false
resolver = "2"
autoexamples = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["gpui-gui"]
gpui-gui = ["toybox/gpui-gui"]
vst3 = ["toybox/gpui-vst3", "gpui-gui"]
screenshot-test = ["dep:image", "gpui-gui"]

[[bin]]
name = "gainsnap_gpui_screenshot"
path = "examples/gainsnap_gpui_screenshot.rs"
required-features = ["screenshot-test"]
test = false
bench = false

[dependencies]
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "c28eb9b4769c1fd62f22a387af71d670a5acdbe0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
unicode-segmentation = "1.12"

[build-dependencies]
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "c28eb9b4769c1fd62f22a387af71d670a5acdbe0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
raw-window-handle = "0.5.2"

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
warnings = "deny"

[lints.rustdoc]
missing_crate_level_docs = "deny"
